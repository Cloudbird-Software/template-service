name: dependabot-automerge
on: pull_request_target

permissions: {}

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # 用 App 身份合并：GITHUB_TOKEN 的合并不会触发下游 workflow（release 等），
      # App 令牌会触发；且合并动作在审计日志中归属 cloudbird-agent[bot]。
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v3.2.0
        id: app
        with:
          app-id: 4632704
          private-key: ${{ secrets.AGENT_APP_SECRET }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: meta
      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          PR: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh pr merge --auto --squash "$PR"
