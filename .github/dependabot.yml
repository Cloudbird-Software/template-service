version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] } # zizmor: ignore[dependabot-cooldown]（gate 全绿才自动合并，无需冷却期）
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-patch: # zizmor: ignore[dependabot-cooldown]
        patterns: ["*"]
        update-types: ["minor", "patch"]
