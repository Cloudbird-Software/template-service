version: 2
updates:
  # zizmor: ignore[dependabot-cooldown]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
        cooldown-days: 7
  # zizmor: ignore[dependabot-cooldown]
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
        cooldown-days: 7
